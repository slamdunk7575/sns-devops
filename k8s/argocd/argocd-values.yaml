# global 속성은 Argo CD 라는 helm 차트 전체에서 공유하는 설정
global:
  # Argo CD Admin Web UI 접속 도메인
  domain: argocd.localhost

configs:
  # cm 은 Config Map 으로 설정을 저장할 값들이 모여있는 파일
  cm:
    # git 의 변경사항을 확인하는 기본 주기
    timeout.reconciliation: 60s
  params:
    # HTTPS / TLS 설정 (true 면 HTTP 사용)
    server.insecure: "true"

# Argo CD 의 Web UI 와 API 서버 설정
server:
  httproute:
    enabled: true
    # traefik 네임스페이스에 설치한 traefik-gateway 리소스가 라우팅을 담당
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    # 호스트 네임은 argocd.localhost 로 맵핑
    hostnames:
      - argocd.localhost

# SSO 로그인을 붙여주는 dex-server (admin 계정만 써서 끔, 기본값: true)
# 사용한다면 예: 하나의 사내 계정 아이디로 쉽게 접속 가능
dex:
  enabled: false

# 동기화 결과를 슬랙, 메일로 보내는 컨트롤러 (안써서 끔, 기본값: true)
# 예: 배포가 잘되었는지 알림으로 받을 수 있음
notifications:
  enabled: false

# Application 을 자동 생성해 주는 컨트롤러 (차트에 enabled 옵션이 없어 파드 수로 끔, 기본값: 1)
applicationSet:
  replicas: 0
