providers:
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443

service:
  spec:
    type: ClusterIP

nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# 확인: kubectl get gatewayclass
# NAME      CONTROLLER                      ACCEPTED   AGE
# traefik   traefik.io/gateway-controller   True       43h
# gatewayclass 란? 어떤 인입이 들어왔을때 gateway 는 traefik 컨트롤러가 관리한다 라고 명시해준는것

# 확인: kubectl get gateway -n traefik
# NAME              CLASS     ADDRESS   PROGRAMMED   AGE
# traefik-gateway   traefik             True         43h
# gateway 란?
# traefik 게이트웨이로 들어온 요청들(예: HTTP 80 포트)을 HTTP 라우팅 테이블을 참고해서 어떤 service 로 연결해줄지를 정의한것
