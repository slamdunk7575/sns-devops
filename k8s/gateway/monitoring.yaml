apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - grafana.localhost
  # monitoring 네임스페이스 안에 grafana 기본 서비스 이름(prometheus-grafana)에 포트 80 연결
  rules:
    - backendRefs:
        - name: prometheus-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  # 기존 traefik 네임스페이 안의 traefik-gateway 에 라우팅 연결
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - prometheus.localhost
  # monitoring 네임스페이스 안에 prometheus 기본 서비스 이름(prometheus-kube-prometheus-prometheus)에 포트 9090 연결
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
